<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vest Agent</title>
<style>
  :root{
    --bg:#0e1116;--panel:#171b22;--panel-2:#1e232c;--border:#2a303b;--text:#e7ebf1;
    --text-dim:#8b93a1;--accent:#4fd1c5;--accent-dim:#2b5e58;--danger:#e5484d;
    --danger-bright:#ff5b60;--ok:#4fd1c5;--warn:#e6bd57;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center}
  .wrap{width:100%;max-width:560px;padding:22px 18px 120px}
  h1{font-size:16px;margin:0 0 2px}
  .sub{color:var(--text-dim);font-size:12.5px;margin:0 0 18px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  .row2{display:flex;gap:16px;flex-wrap:wrap}
  .stat{flex:1;min-width:200px}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin-bottom:6px}
  .stat .v{font-family:var(--mono);font-size:14px;display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--danger);display:inline-block}
  .dot.ok{background:var(--ok)} .dot.wait{background:var(--warn)}
  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin:0 0 10px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--text-dim)}
  input[type=text],input[type=password],input[type=number]{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:6px;font-family:var(--mono);font-size:13px;width:100%}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:7px;font-size:13px;cursor:pointer;font-family:var(--sans)}
  .btn:hover{border-color:var(--accent)}
  .btn.on{border-color:var(--warn);color:var(--warn)}
  .log{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px;height:120px;overflow:auto;white-space:pre-wrap;line-height:1.5}
  #stop-btn{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;width:220px;height:64px;border-radius:14px;background:var(--danger);border:3px solid var(--danger-bright);color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px;cursor:pointer;box-shadow:0 4px 20px rgba(229,72,77,.45);z-index:50}
  #stop-btn:active{transform:translateX(-50%) scale(.97)}
  .pill{font-size:11px;color:var(--warn);font-family:var(--mono)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Vest Agent</h1>
  <p class="sub">Runs on the PC with the vest. Connects out to your relay and drives bHaptics Player locally. Keep this window open.</p>

  <div class="card">
    <div class="row2">
      <div class="stat">
        <div class="k">bHaptics Player</div>
        <div class="v"><span class="dot" id="dot-player"></span><span id="txt-player">connecting…</span></div>
      </div>
      <div class="stat">
        <div class="k">Relay</div>
        <div class="v"><span class="dot" id="dot-relay"></span><span id="txt-relay">idle</span></div>
      </div>
    </div>
    <div id="pause-note" class="pill" style="margin-top:10px;display:none;">Remote paused — incoming pulses ignored (Stop still works)</div>
  </div>

  <div class="card">
    <p class="section-title">Connection</p>
    <div class="field"><label>Relay base URL</label><input type="text" id="cfg-relay" placeholder="https://your-app.vercel.app"></div>
    <div class="grid2">
      <div class="field"><label>Room</label><input type="text" id="cfg-room" placeholder="my-vest"></div>
      <div class="field"><label>Token</label><input type="password" id="cfg-token" placeholder="shared secret"></div>
    </div>
    <p class="section-title" style="margin-top:6px;">bHaptics Player (local)</p>
    <div class="grid2">
      <div class="field"><label>Host</label><input type="text" id="cfg-host" placeholder="127.0.0.1"></div>
      <div class="field"><label>Port</label><input type="number" id="cfg-port" placeholder="15881"></div>
    </div>
    <div class="grid2" style="margin-top:4px;">
      <button class="btn" id="save-btn">Save &amp; (re)connect</button>
      <button class="btn on" id="pause-btn">Pause remote</button>
    </div>
  </div>

  <div class="card">
    <p class="section-title">Activity</p>
    <div class="log" id="log"></div>
  </div>
</div>

<button id="stop-btn">STOP (Esc)</button>

<script>
const APP_ID="com.vestcontrol.agent", APP_NAME="VestAgent";

/* ---------- config ---------- */
function defaultRelay(){ return location.protocol.startsWith("http") ? location.origin : ""; }
function loadCfg(){
  let c={}; try{ c=JSON.parse(localStorage.getItem("vcAgentCfg")||"null")||{}; }catch(e){}
  return {
    relay: c.relay || defaultRelay(),
    room: c.room || "",
    token: c.token || "",
    host: c.host || "127.0.0.1",
    port: c.port || 15881,
  };
}
function saveCfg(c){ localStorage.setItem("vcAgentCfg", JSON.stringify(c)); }
let cfg = loadCfg();

/* ---------- logging ---------- */
const logEl=document.getElementById("log");
function log(msg){
  const t=new Date().toLocaleTimeString();
  logEl.textContent += `[${t}] ${msg}\n`;
  logEl.scrollTop=logEl.scrollHeight;
  const lines=logEl.textContent.split("\n"); if(lines.length>200) logEl.textContent=lines.slice(-200).join("\n");
}

/* ---------- local Player WebSocket ---------- */
let ws=null, wsState="connecting", wsRetry=null, wsIntentional=false;
function wsUrl(){ return `ws://${cfg.host}:${cfg.port}/v2/feedbacks?app_id=${encodeURIComponent(APP_ID)}&app_name=${encodeURIComponent(APP_NAME)}`; }
function setPlayer(state){
  wsState=state; const d=document.getElementById("dot-player"), t=document.getElementById("txt-player"); d.className="dot";
  if(state==="connected"){ d.classList.add("ok"); t.textContent="connected"; }
  else if(state==="connecting"){ d.classList.add("wait"); t.textContent="connecting…"; }
  else{ t.textContent="not connected"; }
}
function connectPlayer(){
  clearTimeout(wsRetry); wsIntentional=false; setPlayer("connecting");
  let s; try{ s=new WebSocket(wsUrl()); }catch(e){ setPlayer("disconnected"); scheduleWs(); return; }
  ws=s;
  s.onopen=()=>{ setPlayer("connected"); log("Player connected."); };
  s.onmessage=()=>{ if(wsState!=="connected") setPlayer("connected"); };
  s.onclose=()=>{ if(ws===s) ws=null; if(!wsIntentional){ setPlayer("disconnected"); scheduleWs(); } };
  s.onerror=()=>{ if(wsState==="connecting"){ setPlayer("disconnected"); log("Can't reach Player at "+cfg.host+":"+cfg.port+" — is it running?"); } };
}
function scheduleWs(){ clearTimeout(wsRetry); wsRetry=setTimeout(connectPlayer,3000); }
function playerReady(){ return ws && ws.readyState===WebSocket.OPEN; }

function frame(position,dotPoints,dur){ return {Type:"frame",Key:"vc_"+position,Frame:{Position:position,DotPoints:dotPoints,PathPoints:[],DurationMillis:dur}}; }
function sendMotorsLocal(motors,duration){
  if(!playerReady()) return;
  const dur=Math.max(20,Math.min(100000,Math.round(duration||200)));
  const front=[],back=[];
  motors.forEach(m=>{
    const idx=Math.max(0,Math.min(39,m.index|0)), inten=Math.max(0,Math.min(100,m.intensity|0));
    if(inten<=0) return;
    if(idx<20) front.push({index:idx,intensity:inten}); else back.push({index:idx-20,intensity:inten});
  });
  const submit=[]; if(front.length) submit.push(frame("VestFront",front,dur)); if(back.length) submit.push(frame("VestBack",back,dur));
  if(submit.length){ try{ ws.send(JSON.stringify({Submit:submit})); }catch(e){} }
}
function stopAllLocal(){ if(playerReady()){ try{ ws.send(JSON.stringify({Submit:[{Type:"turnOffAll"}]})); }catch(e){} } }

/* ---------- remote pause (wearer override) ---------- */
let paused=false;
function setPaused(p){
  paused=p;
  document.getElementById("pause-btn").classList.toggle("on",p);
  document.getElementById("pause-btn").textContent=p?"Resume remote":"Pause remote";
  document.getElementById("pause-note").style.display=p?"block":"none";
}

/* ---------- command execution ---------- */
function execute(cmd){
  if(!cmd||typeof cmd!=="object") return;
  if(cmd.type==="stop"){ stopAllLocal(); log("STOP (remote)"); return; }
  if(paused) return;                       // wearer override: ignore pulses while paused
  if(cmd.type==="dot"){ sendMotorsLocal(cmd.motors||[], cmd.duration); }
}

/* ---------- relay long-poll loop ---------- */
let polling=false;
function setRelay(state,txt){
  const d=document.getElementById("dot-relay"), t=document.getElementById("txt-relay"); d.className="dot";
  if(state==="ok") d.classList.add("ok"); else if(state==="wait") d.classList.add("wait");
  t.textContent=txt;
}
async function pollLoop(){
  if(polling) return; polling=true;
  log("Relay polling started.");
  while(polling){
    if(!cfg.relay||!cfg.room||!cfg.token){ setRelay("","not configured"); await sleep(1000); continue; }
    try{
      const url=`${cfg.relay.replace(/\/$/,"")}/api/poll?room=${encodeURIComponent(cfg.room)}&token=${encodeURIComponent(cfg.token)}`;
      const r=await fetch(url,{method:"GET"});
      if(r.status===401){ setRelay("","bad token"); await sleep(2000); continue; }
      const d=await r.json();
      setRelay("ok","connected");
      if(d.commands && d.commands.length){
        for(const cmd of d.commands){ execute(cmd); if(cmd.type==="stop") break; }
      }
    }catch(e){
      setRelay("wait","reconnecting…");
      await sleep(2000);
    }
  }
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ---------- controls ---------- */
document.getElementById("stop-btn").addEventListener("click",()=>{ setPaused(true); stopAllLocal(); log("STOP (local) — remote paused"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ setPaused(true); stopAllLocal(); log("STOP (local) — remote paused"); } });
document.getElementById("pause-btn").addEventListener("click",()=>{ setPaused(!paused); if(paused) stopAllLocal(); });

document.getElementById("save-btn").addEventListener("click",()=>{
  cfg={
    relay:(document.getElementById("cfg-relay").value||"").trim()||defaultRelay(),
    room:(document.getElementById("cfg-room").value||"").trim(),
    token:(document.getElementById("cfg-token").value||"").trim(),
    host:(document.getElementById("cfg-host").value||"").trim()||"127.0.0.1",
    port:parseInt(document.getElementById("cfg-port").value,10)||15881,
  };
  saveCfg(cfg);
  wsIntentional=true; if(ws){ try{ ws.close(); }catch(e){} } connectPlayer();
  log("Config saved.");
});

function fillCfg(){
  document.getElementById("cfg-relay").value=cfg.relay;
  document.getElementById("cfg-room").value=cfg.room;
  document.getElementById("cfg-token").value=cfg.token;
  document.getElementById("cfg-host").value=cfg.host;
  document.getElementById("cfg-port").value=cfg.port;
}

window.addEventListener("beforeunload",()=>{ stopAllLocal(); });

fillCfg();
connectPlayer();
pollLoop();
</script>
</body>
</html>
